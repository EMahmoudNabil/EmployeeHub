<div class="employee-management-container">
  <!-- Header Section -->
  <header class="management-header">
    <div class="header-content">
      <h1 class="page-title">
        <mat-icon class="title-icon">people</mat-icon>
        Employee Hub
      </h1>
      <button mat-raised-button color="primary" (click)="openAddDialog()" class="add-button">
        <mat-icon>person_add</mat-icon>
        <span class="button-text">Add New Employee</span>
      </button>
    </div>
  </header>


   <!-- Search Component -->
   <app-employee-search 
   [filters]="filters"
   (searchApplied)="applyFilter()"
   (searchReset)="resetFilters()">
 </app-employee-search>


  <!-- Employee Table Section -->
  <section class="table-section">
    <div class="table-container mat-elevation-z3">
      <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="employee-table">
          
          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="id-header">ID</th>
            <td mat-cell *matCellDef="let employee" class="id-cell">{{employee.id}}</td>
          </ng-container>

          <!-- Name Columns -->
          <ng-container matColumnDef="firstName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
            <td mat-cell *matCellDef="let employee" class="name-cell">
              {{employee.firstName}}
            </td>
          </ng-container>

          <ng-container matColumnDef="lastName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
            <td mat-cell *matCellDef="let employee" class="name-cell">{{employee.lastName}}</td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
            <td mat-cell *matCellDef="let employee" class="email-cell">
              <div class="email-wrapper">
                <mat-icon class="email-icon">alternate_email</mat-icon>
                <span class="email-text">{{employee.email}}</span>
              </div>
            </td>
          </ng-container>

          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Position</th>
            <td mat-cell *matCellDef="let employee" class="position-cell">
              <span class="position-tag">{{employee.position}}</span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
            <td mat-cell *matCellDef="let employee" class="actions-cell">
              <div class="actions-container">
                <button mat-icon-button 
                        matTooltip="Edit employee"
                        class="action-btn edit-btn"
                        [matTooltipPosition]="'above'"
                        (click)="openEditDialog(employee); $event.stopPropagation();">
                  <mat-icon class="edit-icon">edit</mat-icon>
                </button>
                <button mat-icon-button 
                        matTooltip="Delete employee"
                        class="action-btn delete-btn"
                        [matTooltipPosition]="'above'"
                        (click)="openDeleteDialog(employee.id); $event.stopPropagation();">
                  <mat-icon class="delete-icon">delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="header-row"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
              class="employee-row"
              [class.selected-row]="selectedRow === row.id"
              (click)="selectRow(row.id)"></tr>
        </table>

        <!-- Loading State -->
        <div *ngIf="isLoading" class="loading-overlay">
          <mat-spinner diameter="50" color="primary"></mat-spinner>
          <p class="loading-text">Loading employees...</p>
        </div>

        <!-- Empty State -->
        <div *ngIf="!isLoading && dataSource.data.length === 0" class="empty-state">
          <mat-icon class="empty-icon">people_outline</mat-icon>
          <h3 class="empty-title">No Employees Found</h3>
          <p class="empty-message">Try adjusting your search or add a new employee</p>
          <button mat-raised-button color="primary" (click)="openAddDialog()" class="empty-add-button">
            <mat-icon>person_add</mat-icon>
            Add Employee
          </button>
        </div>
      </div>

      <!-- Pagination -->
      <mat-paginator
        [length]="totalCount"
        [pageSize]="filters.pageSize"
        [pageSizeOptions]="[5,7, 10]"
        (page)="onPageChange($event)"
        showFirstLastButtons
        class="custom-paginator">
      </mat-paginator>
    </div>
  </section>
</div>
