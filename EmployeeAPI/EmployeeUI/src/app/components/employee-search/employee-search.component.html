<section class="search-section">
    <mat-card class="search-card">
      <div class="search-container">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Search Employees</mat-label>
          <input matInput 
                 [(ngModel)]="filters.search" 
                 (keyup.enter)="applyFilter()"
                 placeholder="Search by name, email, or position">
          <button mat-icon-button matSuffix (click)="applyFilter()" class="search-icon-button">
            <mat-icon>search</mat-icon>
          </button>
        </mat-form-field>
        
        <button mat-raised-button color="primary" (click)="applyFilter()" class="filter-button">
          <mat-icon>filter_list</mat-icon>
          <span class="button-text">Filter</span>
        </button>
        
        <button mat-stroked-button (click)="resetFilters()" class="reset-button">
          <mat-icon>refresh</mat-icon>
          <span class="button-text">Reset</span>
        </button>
      </div>
    </mat-card>
  </section>
